services:

  atmosphere:
    image: atmosphere/atmosphere:latest
    environment:
      ATMOSPHERE_DB: 'pg://db:5432?u=atmosphere&p=quickstart_demo_pw_change_me&d=atmosphere'
      ATMOSPHERE_REDIS_URL: 'redis://redis:6379'
      ATMOSPHERE_SITE_URL: 'http://localhost:8080'
      ATMOSPHERE_DISABLE_MUX: 'true'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - atmosphere_data:/usr/app/data
    networks:
      - atmosphere-network
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 --spider http://localhost:8080/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: atmosphere/atmosphere:latest
    environment:
      ATMOSPHERE_DB: 'pg://db:5432?u=atmosphere&p=quickstart_demo_pw_change_me&d=atmosphere'
      ATMOSPHERE_REDIS_URL: 'redis://redis:6379'
      ATMOSPHERE_SITE_URL: 'http://localhost:8080'
      ATMOSPHERE_WORKER_CONTAINER: 'true'
    depends_on:
      atmosphere:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - atmosphere_data:/usr/app/data
    networks:
      - atmosphere-network

  db:
    image: postgres:17.10
    environment:
      POSTGRES_USER: atmosphere
      POSTGRES_PASSWORD: quickstart_demo_pw_change_me
      POSTGRES_DB: atmosphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atmosphere -d atmosphere']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atmosphere-network

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atmosphere-network

networks:
  atmosphere-network:
    driver: bridge

volumes:
  atmosphere_data:
  postgres_data:
  redis_data:
