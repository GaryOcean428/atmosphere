services:

  atmosphere:
    image: atmosphere/atmosphere:latest
    env_file: docker.env
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - atmosphere_data:/usr/app/data
      - ./atmosphere/db.json:/usr/app/data/db.json
    networks:
      - atmosphere-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 --spider http://localhost:8080/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - '8080:8080'

  worker:
    image: atmosphere/atmosphere:latest
    env_file: docker.env
    environment:
      ATMOSPHERE_WORKER_CONTAINER: 'true'
    depends_on:
      atmosphere:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - atmosphere_data:/usr/app/data
      - ./atmosphere/db.json:/usr/app/data/db.json
    networks:
      - atmosphere-network

  db:
    image: postgres:17.10
    environment:
      POSTGRES_USER: atmosphere
      POSTGRES_PASSWORD: __PASSWORD__
      POSTGRES_DB: atmosphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atmosphere -d atmosphere']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atmosphere-network

networks:
  atmosphere-network:
    driver: bridge

volumes:
  atmosphere_data:
  postgres_data:
